apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sante-ingress
  namespace: sante-medical
  labels:
    app: sante-medical
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # CORS (if needed for API)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://sante-medical.example.com"  # CHANGE_ME
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    
    # Request size
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    
    # Cert-manager for automatic TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: no-referrer-when-downgrade";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";

spec:
  ingressClassName: nginx
  
  tls:
  - hosts:
    - sante-medical.example.com  # CHANGE_ME
    - api.sante-medical.example.com  # CHANGE_ME (optional separate API domain)
    secretName: sante-tls-secret
  
  rules:
  # Frontend
  - host: sante-medical.example.com  # CHANGE_ME
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      
      # API routes (proxied through frontend nginx)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      
      # WebSocket routes
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
  
  # Optional: Separate API subdomain
  # - host: api.sante-medical.example.com  # CHANGE_ME
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: backend-service
  #           port:
  #             number: 8000
