apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sante-medical
  labels:
    app: backend
    tier: application
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      # Wait for database to be ready
      - name: wait-for-postgres
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres-service -p 5432 -U $(POSTGRES_USER); do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
      
      # Wait for Redis
      - name: wait-for-redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - |
          until timeout 1 sh -c "cat < /dev/null > /dev/tcp/redis-service/6379"; do
            echo "Waiting for Redis..."
            sleep 2
          done
      
      # Run migrations
      - name: run-migrations
        image: ghcr.io/your-org/sante-backend:latest  # CHANGE_ME
        command:
        - sh
        - -c
        - |
          echo "Running Alembic migrations..."
          alembic upgrade head
          echo "Migrations complete!"
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads

      containers:
      - name: backend
        image: ghcr.io/your-org/sante-backend:latest  # CHANGE_ME
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: RUN_MIGRATIONS
          value: "false"  # Already done in initContainer
        
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
      
      securityContext:
        fsGroup: 1000
      
      restartPolicy: Always
