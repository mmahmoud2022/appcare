apiVersion: batch/v1
kind: Job
metadata:
  name: update-doctor-statistics-init
  namespace: sante
  labels:
    app: sante-backend
    component: job
    tier: backend
    type: initialization
spec:
  # Durée de vie du job après son achèvement (24 heures)
  ttlSecondsAfterFinished: 86400
  
  # Délai maximum pour terminer le job (1 heure)
  activeDeadlineSeconds: 3600
  
  # Nombre de tentatives en cas d'échec
  backoffLimit: 3
  
  template:
    metadata:
      labels:
        app: sante-backend
        component: job
        job: update-doctor-statistics-init
    spec:
      restartPolicy: OnFailure
      
      containers:
      - name: update-statistics
        image: sante-backend:latest
        imagePullPolicy: IfNotPresent
        
        command:
        - python
        - update_doctor_statistics.py
        
        env:
        # Variables d'environnement depuis le ConfigMap
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DATABASE_URL
        
        # Variables sensibles depuis les Secrets
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SECRET_KEY
        
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        
        # Configuration PostgreSQL
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: POSTGRES_HOST
        
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: POSTGRES_PORT
        
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: POSTGRES_DB
        
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: POSTGRES_USER
        
        # Limites de ressources
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Logs détaillés
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: logs
        emptyDir: {}
