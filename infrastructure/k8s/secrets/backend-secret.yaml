apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: sante-medical
type: Opaque
stringData:
  # JWT Secret - Generate with: openssl rand -hex 32
  SECRET_KEY: CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32
  
  # Database URL (will be constructed from postgres-secret)
  DATABASE_URL: postgresql://sante_user:CHANGE_ME_PASSWORD@postgres-service:5432/sante_db
  
  # Redis URL
  REDIS_URL: redis://redis-service:6379/0
  
  # SMTP Password
  SMTP_PASSWORD: CHANGE_ME_SMTP_PASSWORD
  
  # Optional: AWS SES
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "eu-west-1"
  
  # Optional: Sentry DSN
  SENTRY_DSN: ""
  
  # Optional: S3 Storage
  S3_BUCKET_NAME: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
