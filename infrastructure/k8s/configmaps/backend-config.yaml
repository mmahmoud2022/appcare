apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: sante-medical
data:
  # Application
  APP_NAME: "Santé Medical Platform"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  
  # Database
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "sante_db"
  
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # CORS
  CORS_ORIGINS: "https://sante-medical.com,https://www.sante-medical.com"
  
  # JWT
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  
  # Email
  EMAIL_ENABLED: "true"
  EMAIL_PROVIDER: "smtp"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_TLS: "true"
  SMTP_FROM_EMAIL: "noreply@sante-medical.com"
  SMTP_FROM_NAME: "Santé Medical"
  
  # WebSocket
  WEBSOCKET_ENABLED: "true"
  
  # File Upload
  MAX_FILE_SIZE_MB: "10"
  ALLOWED_FILE_TYPES: "pdf,jpg,jpeg,png,doc,docx"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  
  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Monitoring
  METRICS_ENABLED: "true"
  SENTRY_ENABLED: "false"
