<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f7f7f7; color: #222; margin: 0; padding: 0; }
    .container { background: #fff; max-width: 480px; margin: 32px auto; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 32px 24px; }
    .header { text-align: center; margin-bottom: 24px; }
    .logo { width: 64px; margin-bottom: 8px; }
    .title { color: #00B894; font-size: 1.3em; font-weight: 600; }
    .content { margin: 24px 0; }
    .button { display: inline-block; background: #3498DB; color: #fff; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 500; margin: 16px 0; }
    .footer { font-size: 0.95em; color: #888; text-align: center; margin-top: 32px; }
    .info-box { background: #f0f8f7; border-left: 4px solid #00B894; padding: 12px 16px; border-radius: 6px; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://sante-app.com/logo.png" alt="Santé" class="logo"/>
      <div class="title">Santé Medical</div>
    </div>
    <div class="content">
      {{ content }}
    </div>
    <div class="footer">
      &copy; {{ year }} Santé Medical. Tous droits réservés.<br>
      <span style="font-size:0.9em;">Cet email est généré automatiquement, merci de ne pas répondre.</span>
    </div>
  </div>
</body>
</html>
